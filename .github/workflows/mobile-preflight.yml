name: Mobile Launch Preflight

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-preflight:
    name: Unsigned mobile preflight
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unsigned mobile preflight
        run: npm run mobile:preflight

      - name: Check public store URLs
        if: github.event_name != 'pull_request'
        run: npm run mobile:urls:check

      - name: Upload store submission package
        uses: actions/upload-artifact@v4
        with:
          name: mobile-store-submission
          path: |
            dist/mobile-store-submission
            dist/flag-arcade-mobile-store-submission.zip
            dist/mobile-readiness-report.md
          if-no-files-found: error
