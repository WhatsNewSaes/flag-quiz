<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Flag Arcade — Usage Analytics</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  .nav a { font-size: 14px; text-decoration: none; margin-left: 16px; }
  .windows { display: flex; gap: 8px; }
  .windows button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .windows button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 24px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  tbody tr:last-child td { border-bottom: none; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > span { display: block; height: 100%; background: var(--accent-2); }
  #chart { width: 100%; height: 240px; }
  .muted { color: var(--muted); }
  .status { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .axis { fill: var(--muted); font-size: 11px; }
  .gridline { stroke: var(--line); stroke-width: 1; }
</style>
</head>
<body>
  <header>
    <h1>📊 Usage Analytics</h1>
    <div class="windows">
      <button data-window="7d">7 days</button>
      <button data-window="30d" class="active">30 days</button>
      <button data-window="90d">90 days</button>
    </div>
    <nav class="nav"><a href="/admin/dashboard">Backlink CRM →</a></nav>
  </header>

  <div id="status" class="status">Loading…</div>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>Plays per day</h2>
    <svg id="chart" viewBox="0 0 800 240" preserveAspectRatio="none" aria-label="Plays per day"></svg>
  </section>

  <section class="panel">
    <h2>By game mode</h2>
    <table>
      <thead>
        <tr>
          <th>Mode</th>
          <th>Plays</th>
          <th>Unique players</th>
          <th>Avg length</th>
          <th>Completion</th>
        </tr>
      </thead>
      <tbody id="modeRows"></tbody>
    </table>
  </section>

<script>
const MODE_LABELS = {
  arcade: 'Arcade',
  around_the_world: 'Around the World',
  jeopardy: 'Jeopardy',
  flag_runner: 'Flag Runner',
  journey: 'Journey',
};

function fmtDuration(ms) {
  if (!ms || ms < 0) return '—';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  const d = Math.floor(h / 24);
  return d + 'd ' + (h % 24) + 'h';
}

function fmtNum(n) { return (n || 0).toLocaleString(); }

function pct(part, whole) {
  if (!whole) return '0%';
  return Math.round((part / whole) * 100) + '%';
}

function renderCards(t) {
  const cards = [
    { label: 'Total plays', value: fmtNum(t.plays) },
    { label: 'Unique players', value: fmtNum(t.unique_players) },
    { label: 'Time played', value: fmtDuration(t.total_duration_ms) },
    { label: 'Completion rate', value: pct(t.completed_plays, t.plays), sub: fmtNum(t.completed_plays) + ' finished' },
  ];
  document.getElementById('cards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>`).join('');
}

function renderModes(rows) {
  const maxPlays = rows.reduce((m, r) => Math.max(m, Number(r.plays)), 0) || 1;
  const tbody = document.getElementById('modeRows');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted">No plays in this window yet.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${MODE_LABELS[r.mode] || r.mode}</td>
      <td>${fmtNum(Number(r.plays))}
        <div class="bar"><span style="width:${(Number(r.plays) / maxPlays) * 100}%"></span></div>
      </td>
      <td>${fmtNum(Number(r.unique_players))}</td>
      <td>${fmtDuration(Number(r.avg_duration_ms))}</td>
      <td>${pct(Number(r.completed_plays), Number(r.plays))}</td>
    </tr>`).join('');
}

function renderChart(series) {
  const svg = document.getElementById('chart');
  const W = 800, H = 240, padL = 44, padR = 12, padT = 12, padB = 28;
  if (!series.length) {
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="axis">No data yet</text>`;
    return;
  }
  const maxY = Math.max(1, ...series.map(d => Number(d.plays)));
  const n = series.length;
  const x = i => padL + (n === 1 ? (W - padL - padR) / 2 : (i / (n - 1)) * (W - padL - padR));
  const y = v => padT + (1 - v / maxY) * (H - padT - padB);

  let parts = [];
  // horizontal gridlines + y labels (0, mid, max)
  [0, 0.5, 1].forEach(f => {
    const val = Math.round(maxY * f);
    const yy = y(val);
    parts.push(`<line class="gridline" x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}"/>`);
    parts.push(`<text class="axis" x="${padL - 8}" y="${yy + 4}" text-anchor="end">${val}</text>`);
  });

  const line = series.map((d, i) => `${x(i)},${y(Number(d.plays))}`).join(' ');
  const area = `${padL},${y(0)} ${line} ${x(n - 1)},${y(0)}`;
  parts.push(`<polygon points="${area}" fill="rgba(129,140,248,0.15)"/>`);
  parts.push(`<polyline points="${line}" fill="none" stroke="var(--accent-2)" stroke-width="2"/>`);
  series.forEach((d, i) => {
    parts.push(`<circle cx="${x(i)}" cy="${y(Number(d.plays))}" r="2.5" fill="var(--accent)"><title>${d.day}: ${d.plays} plays</title></circle>`);
  });

  // x labels: first, middle, last
  [0, Math.floor((n - 1) / 2), n - 1].filter((v, idx, arr) => arr.indexOf(v) === idx).forEach(i => {
    parts.push(`<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${series[i].day.slice(5)}</text>`);
  });

  svg.innerHTML = parts.join('');
}

let currentWindow = '30d';

async function load(win) {
  currentWindow = win;
  document.querySelectorAll('.windows button').forEach(b =>
    b.classList.toggle('active', b.dataset.window === win));
  const status = document.getElementById('status');
  status.textContent = 'Loading…';
  try {
    const res = await fetch('/api/analytics?since=' + win);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderCards(data.totals);
    renderModes(data.summary);
    renderChart(data.timeseries);
    status.textContent = 'Last ' + data.days + ' days · ' + fmtNum(Number(data.totals.plays)) + ' plays';
  } catch (e) {
    status.textContent = 'Failed to load analytics: ' + e.message;
  }
}

document.querySelectorAll('.windows button').forEach(b =>
  b.addEventListener('click', () => load(b.dataset.window)));

load(currentWindow);
</script>
</body>
</html>
