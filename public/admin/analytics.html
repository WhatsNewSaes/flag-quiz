<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Flag Arcade — Usage Analytics</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  .nav a { font-size: 14px; text-decoration: none; margin-left: 16px; }
  .windows { display: flex; gap: 8px; }
  .windows button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .windows button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 24px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  tbody tr:last-child td { border-bottom: none; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > span { display: block; height: 100%; background: var(--accent-2); }
  #chart { width: 100%; height: 240px; }
  .muted { color: var(--muted); }
  .status { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .axis { fill: var(--muted); font-size: 11px; }
  .gridline { stroke: var(--line); stroke-width: 1; }

  /* Country list */
  .country-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2px 32px; max-height: 420px; overflow-y: auto;
  }
  .country-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .country-row .rank { width: 22px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .country-row .flag { font-size: 22px; width: 26px; text-align: center; line-height: 1; }
  .country-row .name { flex: 1; min-width: 0; }
  .country-row .name .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .country-row .count { text-align: right; font-variant-numeric: tabular-nums; }
  .country-row .count .sub { color: var(--muted); font-size: 11px; }

  /* Journey funnel */
  .funnel { display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; }
  .funnel-row { display: grid; grid-template-columns: 130px 1fr 56px; align-items: center; gap: 12px; font-size: 13px; }
  .funnel-row .lvl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .funnel-bar { height: 24px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .funnel-bar > span { display: flex; align-items: center; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); padding-left: 8px; color: #0f172a; font-weight: 700; font-size: 12px; min-width: 0; }
  .funnel-row .pl { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <h1>📊 Usage Analytics</h1>
    <div class="windows">
      <button data-window="7d">7 days</button>
      <button data-window="30d" class="active">30 days</button>
      <button data-window="90d">90 days</button>
    </div>
    <nav class="nav"><a href="/admin/dashboard">Backlink CRM →</a></nav>
  </header>

  <div id="status" class="status">Loading…</div>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>🌍 Where players come from</h2>
    <div class="country-list" id="countryList"></div>
  </section>

  <section class="panel">
    <h2>Plays per day</h2>
    <svg id="chart" viewBox="0 0 800 240" preserveAspectRatio="none" aria-label="Plays per day"></svg>
  </section>

  <div class="two-col">
    <section class="panel">
      <h2>By game mode</h2>
      <table>
        <thead>
          <tr>
            <th>Mode</th>
            <th>Plays</th>
            <th>Players</th>
            <th>Avg time/player</th>
          </tr>
        </thead>
        <tbody id="modeRows"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>How far players get in Journey</h2>
      <div class="funnel" id="journeyFunnel"></div>
    </section>
  </div>

<script>
const MODE_LABELS = {
  arcade: 'Arcade',
  around_the_world: 'Around the World',
  jeopardy: 'Jeopardy',
  flag_runner: 'Flag Runner',
  journey: 'Journey',
};

function fmtDuration(ms) {
  if (!ms || ms < 0) return '—';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  const d = Math.floor(h / 24);
  return d + 'd ' + (h % 24) + 'h';
}

function fmtNum(n) { return (n || 0).toLocaleString(); }

function pct(part, whole) {
  if (!whole) return '0%';
  return Math.round((part / whole) * 100) + '%';
}

// Average time played per user = total play time / unique players.
function avgPerUser(totalMs, users) {
  return users > 0 ? totalMs / users : 0;
}

// Flag emoji from a 2-letter ISO code (regional indicator symbols).
function flagEmoji(cc) {
  if (!cc || cc.length !== 2) return '🏳️';
  return cc.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
}

let regionNames;
try { regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) { regionNames = null; }
function countryName(cc) {
  try { return (regionNames && regionNames.of(cc.toUpperCase())) || cc; } catch (e) { return cc; }
}

function renderCards(t) {
  const cards = [
    { label: 'Total plays', value: fmtNum(t.plays) },
    { label: 'Unique players', value: fmtNum(t.unique_players) },
    { label: 'Avg time / player', value: fmtDuration(avgPerUser(Number(t.total_duration_ms), Number(t.unique_players))), sub: 'total time ÷ players' },
    { label: 'Countries', value: fmtNum(t.countries), sub: 'with at least one play' },
  ];
  document.getElementById('cards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>`).join('');
}

function renderModes(rows) {
  const maxPlays = rows.reduce((m, r) => Math.max(m, Number(r.plays)), 0) || 1;
  const tbody = document.getElementById('modeRows');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="muted">No plays in this window yet.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${MODE_LABELS[r.mode] || r.mode}</td>
      <td>${fmtNum(Number(r.plays))}
        <div class="bar"><span style="width:${(Number(r.plays) / maxPlays) * 100}%"></span></div>
      </td>
      <td>${fmtNum(Number(r.unique_players))}</td>
      <td>${fmtDuration(avgPerUser(Number(r.total_duration_ms), Number(r.unique_players)))}</td>
    </tr>`).join('');
}

function renderCountries(rows) {
  const el = document.getElementById('countryList');
  if (!rows.length) {
    el.innerHTML = '<div class="muted">No country data yet.</div>';
    return;
  }
  const max = rows.reduce((m, r) => Math.max(m, Number(r.plays)), 0) || 1;
  el.innerHTML = rows.map((r, i) => `
    <div class="country-row">
      <div class="rank">${i + 1}</div>
      <div class="flag">${flagEmoji(r.country)}</div>
      <div class="name">
        <div class="ttl">${countryName(r.country)}</div>
        <div class="bar"><span style="width:${(Number(r.plays) / max) * 100}%"></span></div>
      </div>
      <div class="count">${fmtNum(Number(r.plays))}<div class="sub">${fmtNum(Number(r.unique_players))} players</div></div>
    </div>`).join('');
}

function renderJourney(rows) {
  const el = document.getElementById('journeyFunnel');
  if (!rows.length) {
    el.innerHTML = '<div class="muted">No Journey plays yet.</div>';
    return;
  }
  const max = Number(rows[0].players_reached) || 1;
  el.innerHTML = rows.map(r => {
    const players = Number(r.players_reached);
    const name = r.level_name || ('Level ' + (Number(r.level_index) + 1));
    return `<div class="funnel-row">
      <div class="lvl" title="${name}">${name}</div>
      <div class="funnel-bar"><span style="width:${Math.max((players / max) * 100, players > 0 ? 8 : 0)}%">${players > 0 ? fmtNum(players) : ''}</span></div>
      <div class="pl">${pct(players, max)}</div>
    </div>`;
  }).join('');
}

function renderChart(series) {
  const svg = document.getElementById('chart');
  const W = 800, H = 240, padL = 44, padR = 12, padT = 12, padB = 28;
  if (!series.length) {
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="axis">No data yet</text>`;
    return;
  }
  const maxY = Math.max(1, ...series.map(d => Number(d.plays)));
  const n = series.length;
  const x = i => padL + (n === 1 ? (W - padL - padR) / 2 : (i / (n - 1)) * (W - padL - padR));
  const y = v => padT + (1 - v / maxY) * (H - padT - padB);

  let parts = [];
  // horizontal gridlines + y labels (0, mid, max)
  [0, 0.5, 1].forEach(f => {
    const val = Math.round(maxY * f);
    const yy = y(val);
    parts.push(`<line class="gridline" x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}"/>`);
    parts.push(`<text class="axis" x="${padL - 8}" y="${yy + 4}" text-anchor="end">${val}</text>`);
  });

  const line = series.map((d, i) => `${x(i)},${y(Number(d.plays))}`).join(' ');
  const area = `${padL},${y(0)} ${line} ${x(n - 1)},${y(0)}`;
  parts.push(`<polygon points="${area}" fill="rgba(129,140,248,0.15)"/>`);
  parts.push(`<polyline points="${line}" fill="none" stroke="var(--accent-2)" stroke-width="2"/>`);
  series.forEach((d, i) => {
    parts.push(`<circle cx="${x(i)}" cy="${y(Number(d.plays))}" r="2.5" fill="var(--accent)"><title>${d.day}: ${d.plays} plays</title></circle>`);
  });

  // x labels: first, middle, last
  [0, Math.floor((n - 1) / 2), n - 1].filter((v, idx, arr) => arr.indexOf(v) === idx).forEach(i => {
    parts.push(`<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${series[i].day.slice(5)}</text>`);
  });

  svg.innerHTML = parts.join('');
}

let currentWindow = '30d';

async function load(win) {
  currentWindow = win;
  document.querySelectorAll('.windows button').forEach(b =>
    b.classList.toggle('active', b.dataset.window === win));
  const status = document.getElementById('status');
  status.textContent = 'Loading…';
  try {
    const res = await fetch('/api/analytics?since=' + win);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    data.totals.countries = (data.byCountry || []).length;
    renderCards(data.totals);
    renderCountries(data.byCountry || []);
    renderChart(data.timeseries);
    renderModes(data.summary);
    renderJourney(data.journey || []);
    status.textContent = 'Last ' + data.days + ' days · ' + fmtNum(Number(data.totals.plays)) + ' plays';
  } catch (e) {
    status.textContent = 'Failed to load analytics: ' + e.message;
  }
}

document.querySelectorAll('.windows button').forEach(b =>
  b.addEventListener('click', () => load(b.dataset.window)));

load(currentWindow);
</script>
</body>
</html>
